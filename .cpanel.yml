# cPanel Git Version Control deployment: copies the site files from the
# server-side clone (~/repositories/KombiRent) into the live document root.
#
# The host has no rsync, so this copies an explicit list with cp. Anything
# not listed (.github/, *.md, docs/) stays out of the docroot. Server-only
# files (php/mail-config.php, .user.ini, php.ini, cgi-bin/, .well-known/)
# are not in git, so cp never overwrites them. Nothing is deleted: a file
# removed from the repo must also be removed from the server by hand.
# A new top-level file or folder must be added to the list below.
---
deployment:
  tasks:
    - export DEPLOYPATH=/home/camper/kombi-samobor.com/
    - /bin/cp -R .htaccess index.html send.php css js images php en hr $DEPLOYPATH
